[project]
name = "puppis"
version = "0.0.1"
description = "Evidplane: personal evidence lake + MCP for agents"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.0.0",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
puppis-mcp = "serve.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connectors*", "lake*", "serve*"]
