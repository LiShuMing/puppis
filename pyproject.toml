[project]
name = "puppis"
version = "0.0.1"
description = "Evidplane: personal evidence lake + MCP for agents"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "opendal>=0.47,<0.48",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "starlette>=1.10,<2",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
browser = ["playwright==1.58.0"]

[project.scripts]
puppis-mcp = "serve.mcp_server:main"
evidplane = "console.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connectors*", "lake*", "serve*", "console*"]

[tool.setuptools.package-data]
lake = ["schema.sql"]
connectors = ["**/*.json", "**/*.ics"]
console = ["static/*"]
